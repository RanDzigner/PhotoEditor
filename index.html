<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator - Modern</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan Font Awesome untuk ikon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animasi kustom untuk loading */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        .loading-pulse {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        /* Desain Glassmorphism ringan */
        .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Latar Belakang Dekoratif -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-indigo-900/20 blur-[120px]"></div>
        <div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] rounded-full bg-purple-900/20 blur-[100px]"></div>
    </div>

    <main class="container mx-auto px-4 py-8 md:py-12 max-w-3xl flex flex-col items-center">
        
        <!-- Header -->
        <div class="text-center mb-10 w-full">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                AI Image Generator
            </h1>
            <p class="text-gray-400 text-sm md:text-base">Buat gambar menakjubkan hanya dengan teks menggunakan kekuatan Google Imagen AI.</p>
        </div>

        <!-- Panel Utama -->
        <div class="glass-panel w-full rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
            
            <!-- Input Prompt -->
            <div>
                <label for="prompt" class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2 text-purple-400"></i>Deskripsi Gambar (Prompt)
                </label>
                <textarea id="prompt" rows="4" 
                    class="bg-gray-900 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 block w-full p-3 text-sm transition-colors resize-none" 
                    placeholder="Contoh: Seekor kucing astronot sedang minum kopi di planet Mars, gaya fotorealistik, pencahayaan sinematik..."></textarea>
                <p class="mt-2 text-xs text-gray-500 text-right">
                    Diberdayakan oleh <a href="https://pollinations.ai" target="_blank" class="text-indigo-400 hover:underline">Pollinations.ai</a> (Gratis, tanpa API Key)
                </p>
            </div>

            <!-- Tombol Generate -->
            <button id="generateBtn" onclick="generateImage()" 
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-lg py-3 px-5 shadow-lg transform transition-all active:scale-95 flex justify-center items-center gap-2">
                <i class="fa-solid fa-image"></i>
                <span>Buat Gambar</span>
            </button>
            
            <!-- Pesan Error -->
            <div id="errorMessage" class="hidden bg-red-900/50 border border-red-500/50 text-red-200 p-3 rounded-lg text-sm"></div>

        </div>

        <!-- Area Hasil Gambar -->
        <div id="resultArea" class="w-full mt-8 hidden flex-col items-center">
            <h2 class="text-xl font-bold mb-4 text-gray-200 self-start">Hasil Gambar:</h2>
            
            <div class="relative w-full rounded-xl overflow-hidden glass-panel border border-gray-700 aspect-square md:aspect-video flex items-center justify-center bg-gray-900">
                <!-- Status Loading -->
                <div id="loadingState" class="hidden flex-col items-center justify-center absolute inset-0 bg-gray-900/80 z-10">
                    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-indigo-300 font-medium animate-pulse">Sedang melukis gambar Anda...</p>
                    <p class="text-gray-500 text-xs mt-2">Ini mungkin memakan waktu beberapa detik.</p>
                </div>

                <!-- Gambar yang dihasilkan -->
                <img id="generatedImage" src="" alt="Hasil Gambar AI" class="w-full h-full object-contain hidden transition-opacity duration-500 opacity-0">
            </div>

            <!-- Tombol Download -->
            <button id="downloadBtn" onclick="downloadImage()" class="hidden mt-6 bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white font-medium rounded-lg py-2 px-6 transition-colors flex items-center gap-2 shadow-md">
                <i class="fa-solid fa-download"></i> Unduh Gambar
            </button>
        </div>

        <!-- Footer -->
        <footer class="mt-12 text-center text-gray-600 text-sm">
            <p>Dibuat untuk Vercel • Gratis tanpa batas</p>
        </footer>

    </main>

    <!-- Script Logika Aplikasi -->
    <script>
        // Menyembunyikan pesan error
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.add('hidden');
            errorDiv.innerText = '';
        }

        // Menampilkan pesan error
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerText = message;
            errorDiv.classList.remove('hidden');
        }

        // Fungsi utama membuat gambar
        async function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            const generateBtn = document.getElementById('generateBtn');
            const resultArea = document.getElementById('resultArea');
            const loadingState = document.getElementById('loadingState');
            const generatedImage = document.getElementById('generatedImage');
            const downloadBtn = document.getElementById('downloadBtn');

            // Validasi Input
            hideError();
            if (!prompt) {
                showError("Mohon masukkan deskripsi gambar (prompt).");
                document.getElementById('prompt').focus();
                return;
            }

            // Siapkan UI untuk loading
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Memproses...</span>';
            generateBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            resultArea.classList.remove('hidden');
            resultArea.classList.add('flex');
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            generatedImage.classList.add('hidden', 'opacity-0');
            downloadBtn.classList.add('hidden');

            try {
                // Pollinations API mengembalikan gambar secara langsung (bukan JSON)
                // Kita gunakan URL dengan prompt yang di-encode
                // Tambahkan random seed agar tidak memunculkan gambar yang sama dari cache jika promptnya persis sama
                const seed = Math.floor(Math.random() * 1000000);
                const encodedPrompt = encodeURIComponent(prompt);
                
                // Dimensi gambar (bisa disesuaikan, misal 1024x1024)
                const width = 1024;
                const height = 1024;
                const model = 'flux'; // Menggunakan model terbaru Flux yang sangat bagus

                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&model=${model}&nologo=true`;

                // Untuk mengecek apakah request berhasil, kita gunakan fetch
                const response = await fetch(imageUrl);

                if (!response.ok) {
                    throw new Error("Terjadi kesalahan pada server saat membuat gambar. Coba lagi nanti.");
                }

                // Karena response-nya adalah file gambar utuh, kita ubah menjadi Blob
                const imageBlob = await response.blob();
                const objectURL = URL.createObjectURL(imageBlob);

                // Tampilkan gambar
                generatedImage.src = objectURL;
                
                // Tunggu gambar terload sebelum menampilkan
                generatedImage.onload = () => {
                    loadingState.classList.add('hidden');
                    loadingState.classList.remove('flex');
                    generatedImage.classList.remove('hidden');
                    
                    // Efek transisi halus
                    setTimeout(() => {
                        generatedImage.classList.remove('opacity-0');
                    }, 50);

                    downloadBtn.classList.remove('hidden');
                };

            } catch (error) {
                console.error("Error:", error);
                showError(error.message);
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
            } finally {
                // Kembalikan status tombol
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fa-solid fa-image"></i><span>Buat Gambar</span>';
                generateBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        // Fungsi untuk mengunduh gambar
        function downloadImage() {
            const imageSrc = document.getElementById('generatedImage').src;
            if (!imageSrc) return;

            const link = document.createElement('a');
            link.href = imageSrc;
            
            // Buat nama file unik berdasarkan waktu
            const timestamp = new Date().getTime();
            link.download = `AI_Image_${timestamp}.png`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
